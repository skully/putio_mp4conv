name: Hello World

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  say-hello:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [ "Alice", "Bob", "Charlie" ]
    environment:
      name: ${{ matrix.name }}
    steps:
      - name: check file
        shell: bash
        run: |
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "GITHUB_WORKFLOW_REF=$GITHUB_WORKFLOW_REF"
          echo "GITHUB_WORKFLOW_SHA=$GITHUB_WORKFLOW_SHA"

          WORKFLOW_FILE=$(basename "${GITHUB_WORKFLOW_REF%@*}")

          echo "Detected workflow file: $WORKFLOW_FILE"

      
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      - name: Say Hello
        run: |
          echo "|${{ secrets.O && format('"{0}"', secrets.O) || 'null' }}|"
          echo "Hello ${{ matrix.name }}"
          source .github/workflows/t.env.sh
          echo "The result is ${DB_PASSWORD} intentionally written here" 
          
